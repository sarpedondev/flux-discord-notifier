[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flux-discord-notifier"
version = "0.1.0"
description = "Turn authenticated Flux events into concise Discord deployment notifications"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flux_discord_notifier"]
