{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flux-discord-notifier.secretName" . }}
  labels:
    {{- include "flux-discord-notifier.labels" . | nindent 4 }}
type: Opaque
stringData:
  discord-webhook-url: {{ required "secrets.discordWebhookUrl is required when creating a Secret" .Values.secrets.discordWebhookUrl | quote }}
  token: {{ required "secrets.hmacToken is required when creating a Secret" .Values.secrets.hmacToken | quote }}
{{- end }}

