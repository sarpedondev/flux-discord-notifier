name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - run: python -m unittest discover -s tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/sarpedondev/flux-discord-notifier:latest
            ghcr.io/sarpedondev/flux-discord-notifier:master
            ghcr.io/sarpedondev/flux-discord-notifier:${{ github.sha }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: >-
          helm lint chart/flux-discord-notifier
          --set secrets.create=true
          --set secrets.discordWebhookUrl=https://discord.example/webhook
          --set secrets.hmacToken=test-token
      - name: Render optional Flux resources
        run: >-
          helm template test chart/flux-discord-notifier
          --set secrets.create=true
          --set secrets.discordWebhookUrl=https://discord.example/webhook
          --set secrets.hmacToken=test-token
          --set flux.enabled=true
